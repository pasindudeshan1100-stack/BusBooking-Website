section {

section > .card {

}

/* Map side */
section .col-6:first-child {

}

section iframe {
    width: 100%;
    height: 100%;

    display: block;

}

/* Right side */
section .col-6:last-child {
    padding: 35px;

    align-items: center;
    background: #ffffff;
}

section .card-body {
    width: 100%;
    padding: 0;
}

/* Form card */
section .card-body > .card {
    border: none;
    box-shadow: none;
    background: transparent;
    padding: 10px;
}

/* Inputs */
section input,
section textarea {
    height: %;
    border: 1px solid #d8e6f5;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    transition: 0.3s;
    background: #f8fbff;
}

/* Input focus */
section input:focus,
section textarea:focus {
    border-color: #168cff;
    box-shadow: 0 0 0 4px rgba(22, 140, 255, 0.12);
    background: white;
}

/* Textarea */
section textarea {
    resize: none;
}

/* Send button */
section button {
    border: none;
    border-radius: 12px;
    padding: 12px 35px;
    font-size: 16px;
    font-weight: 600;
    background: linear-gradient(135deg, #168cff, #0059d6);
    box-shadow: 0 8px 20px rgba(22, 140, 255, 0.25);
    transition: 0.3s;
}

/* Button hover */
section button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(22, 140, 255, 0.35);
}

/* Mobile responsive */
@media (max-width: 768px) {

    section {
        padding: 30px 15px;
    }

    section > .card {
        border-radius: 18px;
    }

    section .col-6 {
        width: 100%;
    }

    section .col-6:first-child {
        min-height: 350px;
    }

    section iframe {
        min-height: 350px;
    }

    section .col-6:last-child {
        padding: 25px;
    }
}
</style>
