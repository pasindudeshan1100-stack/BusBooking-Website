<style>
    body{
        background-color: #f2f5f6;
    }
</style>
<div class="container-fluid">
    <div class="row min-vh-100">
        <div class="col-12 col-md-7 p-0">
           <img src="/images/ChatGPT Image Aug 10, 2026, 12_41_48 PM.png" width="800" height="790" alt="Login Image" class="align-bottom">
        </div>
        <div class="col-12 col-md-4">
            <h1>Welcome</h1>    
            <p>Sign in your account</p>
                <form>
                    <div class="mb-3">
                        <label for="username" class="form-label">e-mail</label>
                        <input type="email" class="form-control" id="username" placeholder="Enter your e-mail">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password">
                    </div>
                    <div class="mb-3 form-check">
                        <div class="row">
                            <div class="col-6">
                                <input type="checkbox" class="form-check-input" id="rememberMe">Remember me
                            </div>
                            <div class="col-6">
                                <label class="form-check-label" for="forgotPassword" ><a href="#">Forgot password?</a></label>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                    <p>Don't have an account? <a href="/signup.html">Sign up</a></p>
                </form>
            </div>
    </div>
</div>
