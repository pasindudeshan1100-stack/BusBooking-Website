    height: 52px;

    border-radius: 10px;
    padding: 12px 15px;
    font-size: 15px;
    transition: all 0.3s ease;
}

/* Textarea */
section form textarea.form-control {
    height: 120px !important;
    resize: none;
}

/* Focus Effect */
section form .form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
}

/* Comments Floating Label */
section .form-floating label {
    color: #646464;
}

/* Send Button */
section form button {

    width: 160px;
    margin: 10px auto 0;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
}

/* Button Hover */
section form button:hover {
    transform: translateY(-3px);

}

/* Mobile */
@media (max-width: 768px) {

    section {
        padding: 30px 15px;
    }

    section .row {
        min-height: auto;
    }

    section .col-6 {
        width: 100%;
    }

    section iframe {
        min-height: 350px;
    }

    section .card-body {
        padding: 25px 15px;
    }

    section form.card {
        padding: 0;
    }
}
</style>
