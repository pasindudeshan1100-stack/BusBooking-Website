<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <style>
        body {
            background-color: #f5f7fa;
        }

        .schedule-header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: white;
            padding: 50px 20px;
            text-align: center;
        }

        .schedule-header h1 {
            font-weight: 700;
        }

        .schedule-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .table thead {
            background-color: #0d6efd;
            color: white;
        }

        .table th,
        .table td {
            padding: 18px;
            vertical-align: middle;
        }

        .route {
            font-weight: 600;
        }

        .time {
            font-weight: 600;
            color: #0d6efd;
        }

        .status {
            color: green;
            font-weight: 600;
        }
    </style>
</head>

<body>

    
    <section class="schedule-header">
        <h1>Bus Vendors</h1>
        <p class="mb-0">
            Welcome to the Bus Vendors page!
        </p>
    </section>
    <nav class="navbar navbar-expand-lg bg-info-subtle shadow-sm py-3">
    <div class="container-fluid px-4">    

        <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">

            <form class="d-flex" role="search">

                <input class="form-control me-2"
                    type="search"
                    id="vendorId"
                    placeholder="Search bus Vendors..."
                    aria-label="Search">

                <button class="btn btn-info text-white fw-semibold"onclick="searchVendors()"
                    type="button">
                    Search
                </button>

            </form>
           
        </div>
          <a href="/vendorform.html" class="btn btn-info text-white fw-semibold" role="button" data-bs-toggle="button" onclick="addVensorbtnOnAction()"> + Add Vendor</a>
            
    </div>
</nav>
    <div class="py-5 mt-5">
        <div class="container">
            <div class="row g-4" id="vendors"></div>
        </div>

   
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
         <script src="/vendors.js"></script>
         <script src="/admin.js"></script>

</body>
</html>
