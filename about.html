  <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-warning-subtle">
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <!-- Card -->
                <div class="card border-0 shadow-lg rounded-4">

                    <!-- Header -->
                    <div class="card-header bg-dark text-white text-center py-4 rounded-top-4">

                        <div class="mb-2">
                            <i class="bi bi-bus-front-fill fs-1 text-warning"></i>
                        </div>

                        <h2 class="fw-bold mb-1">
                            Add Bus Vendor
                        </h2>

                        <p class="text-secondary mb-0">
                            Register a new bus transportation partner
                        </p>

                    </div>


                    <!-- Form Body -->
                    <div class="card-body p-4 p-md-5">

                        <h6 class="text-uppercase text-warning fw-bold mb-4">
                            <i class="bi bi-building me-2"></i>
                            Vendor Information
                        </h6>


                        <div class="row g-4">

                            <!-- Vendor ID -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Vendor ID
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-light border-dark">
                                        <img src="/image/idLogo.png" style="width: 20px;" alt="">
                                    </span>

                                    <input type="text" id="TxtVendorID" class="form-control border-dark"
                                        placeholder="Enter vendor ID">

                                </div>

                            </div>


                            <!-- Vendor Name -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Vendor Name
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-light border-dark">
                                        <img src="/image/nameLogo.png" style="width: 20px;" alt="">
                                    </span>

                                    <input type="text" id="TxtVendorName" class="form-control border-dark"
                                        placeholder="Enter Vendor Name">

                                </div>

                            </div>


                            <!-- Email -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Email Address
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-light border-dark">
                                        <img src="/image/emailLogo.png" style="width: 20px;" alt="">
                                    </span>

                                    <input type="email" id="txtEmail" class="form-control border-dark"
                                        placeholder="vendor@example.com">

                                </div>

                            </div>


                            <!-- Phone -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Phone Number
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-light border-dark">
                                        <img src="/image/phonelogo.png" style="width: 20px;" alt="">
                                    </span>

                                    <input type="tel" id="txtPhone" class="form-control border-dark" placeholder="07X XXX XXXX">

                                </div>

                            </div>

                        </div>


                        <!-- Buttons -->
                        <div class="row g-3 mt-4">

                            <div class="col-md-4">

                                <button type="button" class="btn btn-outline-secondary w-100 py-2"
                                    onclick="history.back()">

                                    <i class="bi bi-arrow-left me-2"></i>
                                    Cancel

                                </button>

                            </div>


                            <div class="col-md-8">

                                <button type="button" class="btn btn-dark w-100 py-2 fw-bold" onclick="AddVendorOnAction()">

                                    <i class="bi bi-plus-circle-fill text-warning me-2"></i>
                                    Add Bus Vendor

                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>




    <script src="/add_vendor_form.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
</body>
</html>
