<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EasyRide - Bus Vendor Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body class="bg-light">

    <!-- Main Container -->
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <!-- Form Card -->
                <div class="card shadow-lg border-0 rounded-4">

                    <!-- Header -->
                    <div class="card-header bg-info text-white text-center py-4 rounded-top-4">

                        <h2 class="fw-bold mb-2">
                            Bus Vendor Form
                        </h2>

                        <p class="mb-0">
                            Register your bus with EasyRide
                        </p>

                    </div>

                    <!-- Form Body -->
                    <div class="card-body p-4">

                        <form action="/submit_vendor_form" method="POST">

                            
                            <!-- Vendor Name -->
                            <div class="mb-3">

                                <label for="location_name" class="form-label fw-semibold">
                                    Location Name
                                </label>

                                <input type="text"
                                    id="location_name"
                                    name="location_name"
                                    class="form-control form-control-lg"
                                   
                                    required>

                            </div>


                            <!-- Email -->
                            <div class="mb-3">

                                <label for="email" class="form-label fw-semibold">
                                    Code
                                </label>

                                <input type="email"
                                    id="code"
                                    name="code"
                                    class="form-control form-control-lg"
                                   
                                    required>

                            </div>


                          


                            <!-- Submit Button -->
                            <div class="d-grid">

                                <button type="button"
                                    class="btn btn-info btn-lg text-white fw-bold" onclick="addLocationbtnOnAction()">
                                
                                   Add Location

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous">
    </script>
    
    <script src="/admin.js"></script>
    <script src="/locations.js"></script>

</body>

</html>
