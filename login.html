<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EasyRide - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>

<body class="bg-white">

    <div class="container-fluid p-0">

        <div class="row g-0 min-vh-100">

            <!-- LEFT IMAGE -->
            <div class="col-lg-7 d-flex">

                <img src="/images/buspage.png"
                     alt="EasyRide Bus Booking"
                     class="w-100 vh-100 object-fit-cover">

            </div>


            <!-- RIGHT SIDE -->
            <div class="col-lg-5 d-flex align-items-center justify-content-center p-4 p-lg-5 bg-white">

                <div class="card border-0 shadow-lg rounded-4 w-100"
                     style="max-width: 480px;">

                    <div class="card-body p-4 p-md-5">

                        <!-- Heading -->
                        <div class="text-center mb-5">

                            <h1 class="fw-bold display-6 mb-2">
                                Welcome Back
                            </h1>

                            <p class="text-secondary mb-0">
                                Log in to continue your journey with EasyRide.
                            </p>

                        </div>


                        <!-- Username -->
                        <div class="mb-4">

                            <label for="userName"
                                   class="form-label fw-semibold">

                                User Name

                            </label>

                            <div class="form-floating">

                                <input type="text"
                                       class="form-control form-control-lg rounded-3"
                                       id="userName"
                                       placeholder="User Name">

                                <label for="userName">
                                    Enter your username
                                </label>

                            </div>

                        </div>


                        <!-- Password -->
                        <div class="mb-4">

                            <label for="txtPassword"
                                   class="form-label fw-semibold">

                                Password

                            </label>

                            <div class="form-floating">

                                <input type="password"
                                       class="form-control form-control-lg rounded-3"
                                       id="txtPassword"
                                       placeholder="Password">

                                <label for="txtPassword">
                                    Enter your password
                                </label>

                            </div>

                        </div>


                        <!-- Remember + Forgot -->
                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="checkbox"
                                       id="rememberMe">

                                <label class="form-check-label"
                                       for="rememberMe">

                                    Remember Me

                                </label>

                            </div>


                            <a href="#"
                               class="text-primary text-decoration-none fw-semibold">

                                Forgot Password?

                            </a>

                        </div>


                        <!-- Sign In -->
                        <div class="d-grid">

                            <button class="btn btn-primary btn-lg rounded-3 fw-bold shadow-sm"
                                    type="button"
                                    onclick="btnLoginOnAction()">

                                Sign In

                            </button>

                        </div>


                        <!-- Register -->
                        <p class="text-center text-secondary mt-4 mb-0">

                            Don't have an account?

                            <a href="register.html"
                               class="text-primary text-decoration-none fw-bold">

                                Register Now

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/app.js"></script>

</body>

</html>
