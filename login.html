<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>


  <div class="">
    <div class="row g-0">

        <div class="col-lg-6">

          
        </div>
<style>
  .card {
    margin: 80px auto;
    padding: 40px;
    width: 100%;
    max-width: 530px;
    border: rgb(18, 17, 16);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    background-color: rgb(253, 252, 251);
}

.btn-primary {
    height: 40px;
    width: 200px;
    border-radius: 10px;
    font-size: 15px;
    transition: 0.3s;
}
.d-grid {
    display: flex !important;
    justify-content: center;
}
.form-floating {
    margin-bottom: 18px;
}

.form-floating .form-control {
    height: 50px;
    border-radius: 12px;
    border: 1px solid #f7f6f2;
    background-color: #f6f4f2;
    font-size: 15px;
    padding-left: 16px;
    transition: all 0.3s ease;
}

.form-floating .form-control:focus {
    background-color: rgb(247, 244, 244);
    border-color: #0d6efd;
    box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
}

.form-floating label {
    color: #777;
    font-size: 15px;
}
.container {
    margin-left: 10px;
    padding: 0;
}

.container .row {
    align-items: center;
}

.container .col {
    font-size: 15px;
}

.container a {
    text-decoration: none;
    color: #0d6efd;
}




</style>
        <div class="col-lg-6">
<div class="card">
 <h1 class="text-center">Welcome</h1> 
 <p>Log in to your account.</p>          
 <label class="form-label">User Name</label>           
 <div class="form-floating mb-3">          
  <input type="text" class="form-control" id="userName" placeholder="name@example.com">
  <label for="floatingInput"></label>
</div>
<label class="form-label">Password</label>
<div class="form-floating">
  <input type="password" class="form-control" id="txtPassword" placeholder="Password">
  <label for="floatingPassword"></label>
</div><br>
<div class="container">
    <div class="row">
        <div class="col">
           <input type="checkbox"> Remember Me 
        </div>
        <div class="col">
            <a href="#" target="_blank">
           Forget  Password?
           </a>
        </div>
    </div>
</div><br>
<div class="d-grid gap-2">
  <button class="btn btn-primary" type="button" onclick="btnLoginOnAction()">Sign In</button>
</div>
<br><p>Don't have account? <a href="register.html">Register Now.</a></p>
        </div>
</div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
