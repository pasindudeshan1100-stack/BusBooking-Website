<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EasyRide | Create Account</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #eef3f9;
        }

        /* MAIN */

        .main-container {
            width: 100%;
            min-height: 100vh;
            padding: 15px;
        }

        .main-row {
            min-height: calc(100vh - 30px);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            background: white;
        }

        /* LEFT IMAGE */
  
        /* RIGHT SIDE */

        .form-section {
            background: #ffffff;
            min-height: calc(100vh - 30px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 60px;
        }

        /* FORM */

        .signup-card {
            width: 100%;
            max-width: 500px;
            border: none;
            background: transparent;
        }

        .signup-card h2 {
            color: #10234b;
            font-size: 30px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #747d90;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .subtitle span {
            color: #1769e0;
            font-weight: 600;
        }

        /* LABEL */

        .form-label {
            color: #18233a;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        /* INPUT */

        .form-control {
            height: 55px;
            border: 1px solid #dce1e9;
            border-radius: 9px;
            padding: 0 16px;

            font-size: 14px;
            color: #333;

            transition: 0.3s;
        }

        .form-control::placeholder {
            color: #a1a8b5;
        }

        .form-control:focus {
            border-color: #1769e0;
            box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.10);
        }

        /* BUTTON */

        .create-btn {
            width: 100%;
            height: 55px;

            border: none;
            border-radius: 9px;

            background: linear-gradient(
                90deg,
                #2878ee,
                #104ed0
            );

            color: white;
            font-size: 15px;
            font-weight: 600;

            transition: 0.3s;
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(23, 105, 224, 0.25);
        }

        /* LOGIN */

        .login-area {
            margin-top: 25px;
            text-align: center;
        }

        .login-area p {
            color: #858c99;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .login-area a {
            color: #1769e0;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
        }

        .login-area a:hover {
            text-decoration: underline;
        }

        /* MOBILE */

        @media (max-width: 991px) {

            .main-container {
                padding: 0;
            }

            .main-row {
                border-radius: 0;
                min-height: 100vh;
            }

            .image-section {
                min-height: 350px;
            }

            .image-section img {
                min-height: 350px;
            }

            .form-section {
                min-height: auto;
                padding: 45px 25px;
            }
        }

        @media (max-width: 576px) {

            .image-section {
                min-height: 280px;
            }

            .image-section img {
                min-height: 280px;
            }

            .form-section {
                padding: 35px 20px;
            }

            .signup-card h2 {
                font-size: 25px;
            }
        }

    </style>

</head>


<body>

    <div class="main-container">

        <div class="row g-0 main-row">


            <!-- ================= LEFT SIDE ================= -->

            <div class="col-lg-7 image-section">

                <img src="/images/ChatGPT Image Sep 4, 2026, 01_57_35 PM.png"
                    alt="EasyRide Bus Booking">

            </div>


            <!-- ================= RIGHT SIDE ================= -->

            <div class="col-lg-5 form-section">

                <div class="signup-card">

                    <h2>
                        Create Your Account
                    </h2>

                    <p class="subtitle">
                        Join <span>EasyRide</span> and start your journey with us.
                    </p>


                    <!-- FULL NAME -->

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                            class="form-control"
                            id="txtFullName"
                            placeholder="Enter your full name">

                    </div>


                    <!-- PHONE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input type="tel"
                            class="form-control"
                            id="txtPhoneNumber"
                            placeholder="Enter your phone number">

                    </div>


                    <!-- USERNAME -->

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input type="text"
                            class="form-control"
                            id="txtUserName"
                            placeholder="Choose a username">

                    </div>


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                            class="form-control"
                            id="txtemailId"
                            placeholder="Enter your email address">

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                            class="form-control"
                            id="txtPassword"
                            placeholder="Create a password">

                    </div>


                    <!-- CREATE ACCOUNT -->

                    <button
                        type="button"
                        class="create-btn"
                        onclick="btnCreateAccountOnAction()">

                        Create Account

                    </button>


                    <!-- LOGIN -->

                    <div class="login-area">

                        <p>
                            Already have an account?
                        </p>

                        <a href="login.html">
                            Login to your account →
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="/app.js"></script>

</body>

</html>
