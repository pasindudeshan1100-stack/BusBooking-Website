<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <div class="">
        <div class="row">

            <div class="col-lg-6">
              
                

            </div>

<style>
    .card {
    margin: 80px auto;
    padding: 40px;
    width: 100%;
    max-width: 530px;
    border: rgb(18, 17, 16);
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    background-color: white;
}
.card .form-control {
    height: 50px;
    border-radius: 10px;
    padding: 12px 15px;
}

.card .btn {
    height: 45px;
    border-radius: 10px;
    font-weight: 600;
    margin-top: 10px;
}
.card p {
    margin-top: 20px;
    text-align: center;
}

.card a {
    text-decoration: navy;
    font-weight: 600;
}
</style>
            <!-- RIGHT SIDE -->

            <div class="col-lg-6">
                <div class="card">

                <h2 class="text-center">
                    Create Your Account
                </h2>

                <input type="text"
                    class="form-control "
                    id="txtFullName"
                    placeholder="Fullname">

                <br>

                <input type="tel"
                    class="form-control "
                    id="txtPhoneNumber"
                    placeholder="Phonenumber">

                <br>

                 <input type="text"
                    class="form-control"
                    id="txtUserName"
                    placeholder="Username">

                <br>


                <input type="email"
                    class="form-control"
                    id="txtemailId"
                    placeholder="email">

                <br>

                <input type="password"
                    class="form-control"
                    id="txtPassword"
                    placeholder="Password">

                <br>

                <div class="d-grid gap-2 col-6 mx-auto">

                    <button class="btn btn-primary"
                        type="button" onclick="btnCreateAccountOnAction()">
                        Create Account
                    </button>

                    <p>
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>

                </div>
            </div>

            </div>


        </div>
    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>

</body>

</html>
